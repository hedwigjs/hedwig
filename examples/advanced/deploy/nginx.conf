# Version-controlled nginx site config for the reference stand VM.
#
# Owned by the demo — the deploy workflow rsyncs this file to
# /etc/nginx/sites-available/hedwig on the VM and reloads nginx.
#
# Layout:
#   /                       → simple landing (empty for now; can serve
#                             a redirect / marketing page later).
#   /demo/advanced/         → shell HTML + main.js + chunks.
#   /demo/advanced/mfe/…    → each MFE's static dist.
#   /demo/advanced/ws|ai|checkout|health|notify → nginx proxies to the
#                             Node backend on :4000 (strips the
#                             /demo/advanced prefix so the backend stays
#                             URL-prefix-agnostic).
#
# The certbot-managed SSL block is preserved below verbatim so the
# certificate + HTTP→HTTPS redirect keep working on renew.

server {
  server_name hedwigjs.com www.hedwigjs.com;

  # Root landing — nothing here yet, redirect to the demo for now.
  location = / {
    return 302 /demo/advanced/;
  }

  # Static shell (SPA fallback → index.html for client-side deep links)
  location /demo/advanced/ {
    alias /var/www/hedwig/shell/;
    try_files $uri $uri/ /demo/advanced/index.html;
  }

  # Static MFE bundles — one alias per remote.
  location /demo/advanced/mfe/menu/          { alias /var/www/hedwig/mfe/menu/;          try_files $uri $uri/ =404; }
  location /demo/advanced/mfe/cart/          { alias /var/www/hedwig/mfe/cart/;          try_files $uri $uri/ =404; }
  location /demo/advanced/mfe/ai-chat/       { alias /var/www/hedwig/mfe/ai-chat/;       try_files $uri $uri/ =404; }
  location /demo/advanced/mfe/notifications/ { alias /var/www/hedwig/mfe/notifications/; try_files $uri $uri/ =404; }
  location /demo/advanced/mfe/checkout/      { alias /var/www/hedwig/mfe/checkout/;      try_files $uri $uri/ =404; }
  location /demo/advanced/mfe/analytics/     { alias /var/www/hedwig/mfe/analytics/;     try_files $uri $uri/ =404; }

  # Backend: WebSocket (upgrade + long-lived).
  location /demo/advanced/ws/notifications {
    proxy_pass http://127.0.0.1:4000/ws/notifications;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Backend: SSE (no buffering, keep the stream open).
  location /demo/advanced/ai/stream {
    proxy_pass http://127.0.0.1:4000/ai/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    add_header X-Accel-Buffering no;
  }

  # Backend: iframe HTML (GET) + submit (POST) + friends.
  location = /demo/advanced/checkout { proxy_pass http://127.0.0.1:4000/checkout; proxy_set_header Host $host; }
  location = /demo/advanced/notify   { proxy_pass http://127.0.0.1:4000/notify;   proxy_set_header Host $host; }
  location = /demo/advanced/health   { proxy_pass http://127.0.0.1:4000/health; }

  listen [::]:443 ssl ipv6only=on; # managed by Certbot
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/hedwigjs.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/hedwigjs.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = www.hedwigjs.com) { return 301 https://$host$request_uri; } # managed by Certbot
  if ($host = hedwigjs.com)     { return 301 https://$host$request_uri; } # managed by Certbot

  listen 80 default_server;
  listen [::]:80 default_server;
  server_name hedwigjs.com www.hedwigjs.com;
  return 404; # managed by Certbot
}
