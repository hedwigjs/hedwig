name: Release

# Version-bump & npm publish flow driven by Changesets.
#
# Push to main → this workflow runs:
#   - If pending .changeset/*.md files exist → opens/updates a
#     "Version Packages" PR that bumps versions + regenerates changelogs.
#   - If the merge of that PR just landed (version fields changed, no
#     more pending changesets) → runs `npm publish` for each bumped
#     package under the @hedwigjs org.
#
# Required repository secret:
#   NPM_TOKEN — granular access token with Read/Write on the @hedwigjs
#               scope and "Bypass 2FA restrictions" enabled.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the Version Packages branch + push
      pull-requests: write  # open/update the Version Packages PR
      id-token: write       # npm provenance (future)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public packages
        # Publish artifact = each package's `dist/`. Build first so a merge
        # of the Version Packages PR ships the current sources, not a
        # stale bundle from someone's laptop.
        run: |
          npm run build -w @hedwigjs/broker
          npm run build -w @hedwigjs/devtools
          npm run build -w @hedwigjs/create-registry

      - name: Changesets — create Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Applied when a Version Packages PR is merged — this is the
          # actual publish step. When there are still pending changesets,
          # changesets/action opens/updates the PR instead and this
          # script is not invoked.
          publish: npx changeset publish
          commit: "chore(release): bump versions"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            echo "## 📦 Published" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '${{ steps.changesets.outputs.publishedPackages }}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          elif [ -n "${{ steps.changesets.outputs.pullRequestNumber }}" ]; then
            echo "## 📝 Version PR ready — #${{ steps.changesets.outputs.pullRequestNumber }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## No pending changesets" >> $GITHUB_STEP_SUMMARY
            echo "Nothing to version or publish." >> $GITHUB_STEP_SUMMARY
          fi
