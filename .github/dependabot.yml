version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["jest*", "ts-jest", "tsup", "typescript", "@types/*", "@playwright/test", "webpack*", "tsx"]
      react:
        patterns: ["react", "react-dom"]
      vue:
        patterns: ["vue"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
